  <style>

    *{box-sizing:border-box} html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:12px}
    button{font:inherit} button,a{-webkit-tap-highlight-color:transparent} button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

    .nav-btn svg{width:15px;height:15px;flex:none}.nav-count{margin-left:auto;font:10px var(--num);color:var(--dim)}

    .rail-foot strong{display:block;color:var(--ink2);font-weight:550}.rail-foot button{margin-top:9px}
    .main{min-width:0}.topbar{min-height:58px;padding:10px 18px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--line)}

    .panel-h{padding:12px 14px 10px;border-bottom:1px solid var(--line-soft);display:flex;align-items:flex-start;gap:10px}.panel-h h2{font-size:12px;margin:0;font-weight:650}.panel-h p{margin:4px 0 0;color:var(--dim);font-size:10px;line-height:1.5}.panel-b{padding:14px}.panel-b.flush{padding:0}

    .btn:hover{border-color:var(--accent);color:var(--ink)}.btn.primary{background:var(--accent-soft);border-color:rgba(88,166,255,.55);color:var(--ink)}.btn.ghost{background:transparent;border-color:transparent;color:var(--dim)}.btn.small{min-height:25px;padding:4px 8px;font-size:11px}.btn svg{width:14px;height:14px}
    .chip{display:inline-flex;align-items:center;gap:5px;padding:3px 7px;border:1px solid var(--line-strong);border-radius:2px;color:var(--ink2);font-size:10px;white-space:nowrap}.chip.accent{border-color:rgba(88,166,255,.45);color:var(--accent)}.chip.warn{border-color:rgba(245,165,36,.45);color:var(--warning)}.chip.fault{border-color:rgba(185,140,255,.5);color:var(--fault)}.chip.neutral{color:var(--dim)}

    .account-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line-soft);border:1px solid var(--line-soft)}.account-cell{background:var(--panel);padding:12px}.account-cell span{color:var(--dim);font-size:10px}.account-cell b{display:block;margin-top:5px;font:16px var(--num);font-weight:500}.account-cell small{display:block;color:var(--dim);margin-top:4px;font-size:10px}
    .key-values{display:grid;gap:9px;margin-top:13px}.kv{display:flex;gap:12px;align-items:baseline}.kv dt{color:var(--dim);min-width:72px}.kv dd{margin:0 0 0 auto;text-align:right;color:var(--ink2)}.kv dd.num{font-family:var(--num)}
    .pipeline{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));padding:16px 12px}.pipe{position:relative;text-align:center;min-width:0}.pipe:not(:last-child):after{content:"";position:absolute;left:calc(50% + 24px);right:calc(-50% + 24px);top:18px;height:1px;background:var(--line-strong)}
    .pipe-node{position:relative;z-index:1;width:36px;height:36px;margin:0 auto 9px;border:1px solid var(--line-strong);border-radius:50%;display:grid;place-items:center;background:var(--panel);font:13px var(--num);color:var(--ink2)}.pipe.done .pipe-node{border-color:var(--accent);color:var(--accent)}.pipe.wait .pipe-node{border-style:dashed;color:var(--dim)}

    .table-wrap{overflow-x:auto}.data-table{width:100%;border-collapse:collapse;table-layout:fixed}.data-table th{text-align:left;color:var(--dim);font-size:10px;font-weight:500;padding:9px 11px;border-bottom:1px solid var(--line);background:#11151c}.data-table td{padding:10px 11px;border-bottom:1px solid var(--line-soft);vertical-align:top;line-height:1.55;color:var(--ink2)}.data-table tr:last-child td{border-bottom:0}.data-table tbody tr.row-button{cursor:pointer}.data-table tbody tr.row-button:hover td{background:rgba(88,166,255,.035)}.row-toggle{display:block;width:100%;padding:0;border:0;background:transparent;color:inherit;text-align:left;cursor:pointer}
    .sym{font:11px var(--num);color:var(--ink)}.name{color:var(--ink);font-weight:550}.muted{color:var(--dim)}.small{font-size:11px}.micro{font-size:10px}.num{font-family:var(--num);font-variant-numeric:tabular-nums}.right{text-align:right}.strong{color:var(--ink);font-weight:600}.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .detail-row td{background:var(--input);padding:14px 16px}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.detail-grid h4{margin:0 0 6px;color:var(--ink);font-size:11px}.detail-grid p{margin:0;color:var(--ink2);line-height:1.75}.evidence-id{margin-top:12px;color:var(--dim);font:10px/1.7 var(--num);word-break:break-all}

    .progress{height:6px;background:var(--line);margin:14px 0 8px}.progress i{display:block;height:100%;width:0;background:var(--accent)}.progress-note{display:flex;justify-content:space-between;color:var(--dim);font:10px var(--num)}
    .timeline{display:grid;gap:0}.time-row{display:grid;grid-template-columns:92px 18px minmax(0,1fr);gap:10px;min-height:72px}.time-date{font:11px var(--num);color:var(--ink2);padding-top:2px}.time-axis{position:relative}.time-axis:before{content:"";position:absolute;left:8px;top:8px;bottom:-8px;width:1px;background:var(--line-strong)}.time-row:last-child .time-axis:before{display:none}.time-axis:after{content:"";position:absolute;left:5px;top:5px;width:7px;height:7px;border-radius:50%;background:var(--panel);border:1px solid var(--accent)}.time-body{padding-bottom:18px}.time-body strong{display:block;margin-bottom:5px}.time-body p{margin:0;color:var(--dim);line-height:1.65}
    .phase{padding:15px 16px;border-bottom:1px solid var(--line-soft)}.phase:last-child{border-bottom:0}.phase-head{display:flex;align-items:center;gap:9px;margin-bottom:8px}.phase-head b{font:12px var(--num);color:var(--accent)}.phase h3{margin:0;font-size:12px}.phase p{margin:0 0 8px;color:var(--ink2);line-height:1.7}.phase ul{margin:7px 0 0;padding-left:18px;color:var(--dim);line-height:1.75}
    .check-list{display:grid;gap:10px}.check{display:flex;gap:9px;line-height:1.6;color:var(--ink2)}.check:before{content:"";width:8px;height:8px;border:1px solid var(--accent);margin-top:5px;flex:none}.check.target:before{border-style:dashed;border-color:var(--dim)}
    dialog{width:min(620px,calc(100vw - 32px));background:var(--panel);color:var(--ink);border:1px solid var(--line-strong);border-radius:var(--r);padding:0;box-shadow:0 24px 80px rgba(0,0,0,.45)}dialog::backdrop{background:rgba(0,0,0,.65)}.dialog-h{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}.dialog-h h2{font-size:13px;margin:0}.dialog-b{padding:16px;line-height:1.8;color:var(--ink2)}.dialog-b p{margin:0 0 12px}.dialog-b code{display:block;padding:10px;background:var(--input);border:1px solid var(--line);color:var(--ink);font:11px/1.7 var(--num);white-space:pre-wrap;word-break:break-all}.close{margin-left:auto}
    .empty{padding:26px;text-align:center;color:var(--dim)}.footer-note{color:var(--dim);font-size:10px;line-height:1.65;padding:2px 2px 0}.mobile-nav{display:none}
    @media(max-width:1050px){.two{grid-template-columns:1fr}.hero-metrics{padding-left:16px;gap:15px}.pipeline{grid-template-columns:repeat(3,1fr);row-gap:20px}.pipe:nth-child(3):after{display:none}.metric-grid{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:760px){.app{display:block}.rail{position:static;height:auto;min-height:0;border-right:0;border-bottom:1px solid var(--line)}.brand{height:52px}.rail-foot,.nav-label{display:none}.nav{display:flex;overflow-x:auto;padding:7px}.nav-btn{width:auto;flex:none;border-left:0;border-bottom:2px solid transparent;padding:7px 9px}.nav-btn[aria-current="page"]{border-left-color:transparent;border-bottom-color:var(--accent)}.nav-count{display:none}.topbar{padding:11px 13px;flex-wrap:wrap}.topbar .spacer{display:none}.topbar .btn{margin-left:auto}.sessionbar{padding:7px 13px;gap:8px}.content{padding:12px}.hero{grid-template-columns:1fr;padding:16px}.hero h2{font-size:19px}.hero-metrics{border-left:0;border-top:1px solid var(--line-strong);padding:14px 0 0;justify-content:flex-start}.big-metric{text-align:left}.pipeline{grid-template-columns:repeat(2,1fr)}.pipe:nth-child(3):after{display:block}.pipe:nth-child(even):after{display:none}.detail-grid{grid-template-columns:1fr}.action{grid-template-columns:25px minmax(0,1fr)}.action .btn{grid-column:2;justify-self:start}.data-table{min-width:720px}.metric-grid{grid-template-columns:1fr 1fr}.time-row{grid-template-columns:76px 16px minmax(0,1fr)}.panel-h{flex-wrap:wrap}.panel-h .filters{margin-left:auto}}

    @media(prefers-reduced-motion:no-preference){.btn,.nav-btn,.filter-btn{transition:background-color .15s,border-color .15s,color .15s}.content.enter{animation:enter .18s ease-out}@keyframes enter{from{opacity:.65}to{opacity:1}}}
  </style>

推进，不用日期未到的新数据倒填',`<div class="panel-b"><div class="timeline"><div class="time-row"><div class="time-date">2026-11-13</div><div class="time-axis"></div><div class="time-body"><strong>T 日：证据与判断已冻结</strong><p>7 份证据被阅读，形成 5 条不可事后改写的判断。</p></div></div><div class="time-row"><div class="time-date">2026-11-16</div><div class="time-axis"></div><div class="time-body"><strong>T+1：等待真实 bar 与可执行机会代理</strong><p>一字、排队未知、缺 bar、停牌和预算不足均不记 0 收益。</p></div></div><div class="time-row"><div class="time-date">2026-11-17</div><div class="time-axis"></div><div class="time-body"><strong>T+2：到达复评与退出边界</strong><p>只有真实后续出现后，才计算扣成本净超额和独立日区间。</p></div></div></div></div>`)}`}

    function quality(){return `<section class="hero"><div><div class="eyebrow">覆盖能力 vs 可信覆盖</div><h2>91.6 能看见多少；71.6 才能提醒哪些不能直接信</h2><p>新增可信分不是收益分，也不表示其余数据已被证明正确。它只把已知 error issue 和当前 quarantine 从“可信覆盖”中剔除。</p></div><div class="hero-metrics"><div class="big-metric"><b>${DATA.quality.coverage}</b><span>原覆盖分</span><em>口径保持不变</em></div><div class="big-metric"><b>${DATA.quality.trusted}</b><span>可信覆盖分</span><em>质量差值 ${DATA.quality.penalty}</em></div></div></section><div class="metric-grid"><div class="metric"><span>错误问题</span><b>${DATA.quality.errors}</b><small>进入可信覆盖评分</small></div><div class="metric"><span>警告分区</span><b>${DATA.quality.warnings}</b><small>披露，不任意扣分</small></div><div class="metric"><span>当前隔离</span><b>${DATA.quality.quarantine}</b><small>若出现则可信覆盖计 0</small></div><div class="metric"><span>源间冲突</span><b>${DATA.quality.conflicts}</b><small>不取平均，单独呈现</small></div></div><div class="grid two">${panel('16 条错误问题定位','先确认校验器、源数据还是入库逻辑，再决定修复或回填',`<div class="table-wrap"><table class="data-table"><colgroup><col style="width:20%"><col style="width:12%"><col style="width:38%"><col style="width:30%"></colgroup><thead><tr><th>数据集</th><th>条数</th><th>错误代码</th><th>影响</th></tr></thead><tbody>${DATA.quality.issues.map(i=>`<tr><td class="sym">${i.dataset}</td><td class="num">${i.count}</td><td>${i.code}</td><td><span class="chip fault">${i.impact}</span></td></tr>`).join('')}</tbody></table></div>`)}${panel('阅读纪律','把“不知道”保留在界面上',`<div class="panel-b"><div class="check-list"><div class="check">price_volume 原覆盖仍为 1.0，但可信覆盖为 0，最弱项指向 adj_factor。</div><div class="check">etf_cb 同样由 1.0 降为 0，指向 fund_adj / cb_daily。</div><div class="check">普通 warning 不设一个拍脑袋的比例惩罚；错误与警告必须分开。</div><div class="check">缺失、pending、排队未知和统计不足，都不能被格式化成 0。</div></div></div>`)}</div><div class="notice"><strong>下一步不是继续堆因子。</strong>优先核对 adj_factor_decrease、non_positive_price、ohlc_inconsistent 与源间冲突；数据正确性没有核清时，更复杂的算子只会放大假象。</div>`}

    function blueprint(){return `<div class="notice"><strong>本原型可以直接映射到当前工程。</strong>第一阶段只重排现有只读接口，不修改账本、不自动下单、不改变 candidate/watch 语义；可信分在运行服务加载第二阶段新实现后改为实时读取。</div><div class="grid two">${panel('实施路径','每一步都有可验收结果，而不是一次性重写全部前端',`<div><div class="phase"><div class="phase-head"><b>01</b><h3>先改「今日」信息架构</h3></div><p>接入 dashboard、short-alpha tracking / execution，把下一步、六环进度和冻结判断放到首屏；规则候选与行业榜降为二级证据。</p><ul><li>保留现有面板视觉与只读边界</li><li>空、pending、tracking_only 分别显示</li><li>增加交班摘要导出</li></ul></div><div class="phase"><div class="phase-head"><b>02</b><h3>接通行动入口，而不是自动交易</h3></div><p>备忘录到期、假设草稿、票据待处理和数据质量问题分别链接到既有工作流；任何买卖仍走 propose → ticket → approve。</p><ul><li>每条待办显示负责人、状态和下一窗口</li><li>guard 拒绝保持结论，不换参数绕行</li><li>内核判断与模型判断继续分离</li></ul></div><div class="phase"><div class="phase-head"><b>03</b><h3>用真实结算驱动后续算法</h3></div><p>只有真实后续积累后，才扩展执行校准、成交概率和衰减分析；不足阈值时继续显示“未判定”。</p><ul><li>至少 20 个可判定决策再给决策超额区间</li><li>n 与独立日同时达标才讨论分布</li><li>replay 与 prospective 永不合流</li></ul></div></div>`)}${panel('验收指标','以下是设计目标，不是当前实测结果',`<div class="panel-b"><div class="check-list"><div class="check target">10 秒内能定位当前唯一下一步，而不是先读十几张图。</div><div class="check target">100% 冻结判断都能查到理由、失效条件、窗口和真实执行状态。</div><div class="check target">0 个 candidate 被展示为已成交、已验证 α 或收益承诺。</div><div class="check target">0 个 null / pending 被格式化成 0 收益。</div><div class="check target">100% 已知数据错误在相关证据旁可见，而不是只藏在内核页。</div><div class="check target">每次交班都能回答：新增了什么证据、结算了什么、下一步是什么。</div></div></div>`)}</div>${panel('现有接口映射','不需要为了首版原型发明新数据源',`<div class="panel-b"><dl class="key-values"><div class="kv"><dt>账户 / 待办</dt><dd class="num">GET /dashboard.json?slim=1</dd></div><div class="kv"><dt>冻结判断</dt><dd class="num">GET /short-alpha/tracking</dd></div><div class="kv"><dt>票据与复评</dt><dd class="num">GET /short-alpha/execution</dd></div><div class="kv"><dt>覆盖与质量</dt><dd class="num">GET /data/information</dd></div></dl><div class="notice" style="margin-top:14px">价值来自信息组织和可结算纪律，不是把同一批数据换成更炫的图。</div></div>`)}${panel('本次原型验证记录','实测，不是生产验收',`<div class="panel-b"><div class="check-list"><div class="check">真实窄屏视口 511 × 647；五个视图均可渲染，页面无整体横向溢出，宽表在自身容器内滚动。</div><div class="check">全部 5 / candidate 2 / watch 3 筛选正确；整行与按钮均可展开；执行说明弹窗可用。</div><div class="check">交班摘要下载 1,876 字节并已读回核对；内联 JavaScript 语法检查通过，操作后浏览器控制台无报错。</div><div class="check">尚未完成 1440px 真实宽屏实测；桌面布局只完成 CSS 静态核对，不把断点存在当作验收通过。</div></div></div>`)}`}

    function render(){const [title,sub]=titles[state.view];document.getElementById('view-title').textContent=title;document.getElementById('view-sub').textContent=sub;document.querySelectorAll('[data-view]').forEach(b=>{if(b.classList.contains('nav-btn')){if(b.dataset.view===state.view)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')}});view.innerHTML=({today,judgments,settlement,quality,blueprint})[state.view]();view.classList.remove('enter');void view.offsetWidth;view.classList.add('enter');window.scrollTo({top:0,behavior:'instant'});}
    function openDialog(title,html){document.getElementById('dialog-title').textContent=title;document.getElementById('dialog-body').innerHTML=html;document.getElementById('dialog').showModal()}
    function download(){const lines=['# 量化台交班摘要','',`- 快照：${DATA.snapshot.captured_at}`,'- 账户：paper；权益 ¥5,000.00；现金 ¥5,000.00；持仓 0；成交 0','- 能力证据：edge n=0、n_days=0，尚未判定','- 数据质量：覆盖 91.6；可信覆盖 71.6；错误问题 16；警告分区 45；冲突 1','', '## 下一步',...DATA.duties.map((d,i)=>`${i+1}. ${d.title}：${d.detail}`),'','## 冻结判断（不是买入指令）',...DATA.judgments.map(j=>`- ${j.symbol} ${j.name}｜${j.role}｜tracking_only｜等待 T+1 日线｜${j.invalidation}`),'','## 边界','pending 不记 0 收益；没有票据、成交、复评或结算时，不填造成交或能力证据。'];const blob=new Blob([lines.join('\n')],{type:'text/markdown;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='quant-desk-handoff-20261115.md';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
    document.addEventListener('click',e=>{const b=e.target.closest('button,[data-expand]');if(!b)return;if(b.dataset.view){state.view=b.dataset.view;state.expanded=null;render()}if(b.dataset.role){state.role=b.dataset.role;state.expanded=null;render()}if(b.dataset.expand){state.expanded=state.expanded===b.dataset.expand?null:b.dataset.expand;render()}if(b.dataset.duty!==undefined){const d=DATA.duties[Number(b.dataset.duty)];openDialog(d.title,`<p>${esc(d.detail)}</p>${d.command?`<code>${esc(d.command)}</code>`:''}<p style="margin-top:12px">${esc(d.note)}</p>`)}if(b.dataset.modal==='boundary'){openDialog('原型边界','<p>这是一个可交互的高保真设计原型，不连接后端、不发起订单、不修改账本。</p><p>账户、判断与执行状态来自 2026-11-15 20:21 的本地只读接口；质量分来自第二阶段对 2026-11-13 数据的只读复算，quote probe 固定为 1.0。</p><p>页面中的 candidate / watch 都是已冻结研究判断，不是买卖建议。实施阶段的数字是验收目标，不是当前实测结果。</p>')}if(b.hasAttribute('data-close'))document.getElementById('dialog').close()});
    document.getElementById('download').addEventListener('click',download);document.getElementById('dialog').addEventListener('click',e=>{if(e.target.id==='dialog')e.target.close()});render();
  </script>
